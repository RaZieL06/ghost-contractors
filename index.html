<script>
const overlay=document.getElementById('overlay'),panel=document.getElementById('panel');
function closePanel(){overlay.style.display='none'}
function goFullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
function openPanel(type){overlay.style.display='flex';if(type==='about')panel.innerHTML='<div class="tag">GHOST UNIT // TACTICAL NETWORK</div><h1>GHOST CONTRACTORS</h1><p>Suntem o echipă de airsoft unită de pasiunea pentru joc, strategie și spirit de echipă.</p><p>Pentru noi, fiecare meci înseamnă comunicare, coordonare, respect și încredere între colegi. Intrăm pe teren pentru experiență, adrenalină și distracție, dar păstrăm mereu fair-play-ul și respectul față de adversari.</p><p>Aici membrii pot rămâne conectați, pot organiza meciuri, pot primi anunțuri și pot comunica mai ușor între ei.</p><p>Pe teren, fiecare are rolul său. O echipă bună nu înseamnă un singur jucător bun, ci oameni care știu să lucreze împreună.</p><button class="btn dark" onclick="closePanel()">ÎNAPOI</button>';if(type==='register')panel.innerHTML='<div class="tag">NEW OPERATIVE // REGISTRATION</div><h1>CREEAZĂ CONT</h1><input id="nick" placeholder="Nickname"><input id="name" placeholder="Nume complet"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Parolă, minimum 8 caractere"><input id="pass2" type="password" placeholder="Confirmă parola"><button class="btn" onclick="createAccount()">CREEAZĂ CONTUL</button><div class="msg" id="msg"></div><button class="btn dark" onclick="closePanel()">ÎNAPOI</button>';if(type==='login')panel.innerHTML='<div class="tag">SECURE TERMINAL // LOGIN</div><h1>AUTENTIFICARE</h1><input id="lemail" type="email" placeholder="Email"><input id="lpass" type="password" placeholder="Parolă"><button class="btn" onclick="login()">INTRĂ ÎN CONT</button><div class="msg" id="msg"></div><button class="btn dark" onclick="closePanel()">ÎNAPOI</button>'}
const GC_OWNER_EMAILS=['teodoramaria.simona@yahoo.com'];
function createAccount(){const n=document.getElementById('nick').value.trim(),name=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('pass').value,p2=document.getElementById('pass2').value,m=document.getElementById('msg');if(!n||!name||!e||p.length<8||p!==p2){m.textContent='Completează corect datele. Parola trebuie să aibă minimum 8 caractere.';return}const role=GC_OWNER_EMAILS.includes(e)?'OWNER':'MEMBER';localStorage.setItem('gc_user',JSON.stringify({nickname:n,name,email:e,password:p,role}));m.textContent=role==='OWNER'?'Cont creat pe acest dispozitiv. Rol: OWNER. Acum te poți autentifica.':'Cont creat pe acest dispozitiv. Rol: MEMBER. Acum te poți autentifica.'}
function login(){const u=JSON.parse(localStorage.getItem('gc_user')||'null'),e=document.getElementById('lemail').value.trim(),p=document.getElementById('lpass').value,m=document.getElementById('msg');if(u&&u.email===e&&u.password===p){m.textContent='ACCES AUTORIZAT. Bine ai venit, '+u.nickname+'. Rol: '+(u.role||'MEMBRU')+'.'}else m.textContent='Date incorecte sau contul nu există pe acest dispozitiv.'}
overlay.addEventListener('click',e=>{if(e.target===overlay)closePanel()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
